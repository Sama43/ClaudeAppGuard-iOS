name: ClaudeAppGuard
options:
  bundleIdPrefix: com.claudeguard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: "5.1.3"

targets:
  ClaudeAppGuard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: AppSources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudeguard.iosvpn
        PRODUCT_NAME: ClaudeAppGuard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ClaudeAppGuard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
    dependencies:
      - target: PacketTunnel
        embed: true
      - package: Yams
      - framework: Frameworks/Corebridge.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
      - sdk: libresolv.tbd

  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: TunnelSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudeguard.iosvpn.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TunnelResources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelResources/PacketTunnel.entitlements
        ENABLE_BITCODE: NO
        SKIP_INSTALL: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
    dependencies:
      - package: Yams
      - framework: Frameworks/Corebridge.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
      - sdk: libresolv.tbd
