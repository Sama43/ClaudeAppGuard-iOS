name: ClaudeAppGuard
options:
  bundleIdPrefix: com.claudeguard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: "5.1.3"

targets:
  ClaudeAppGuard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: AppSources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudeguard.iosvpn
        PRODUCT_NAME: ClaudeAppGuard
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ClaudeAppGuard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
          - "-framework"
          - "Security"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "CFNetwork"
          - "-framework"
          - "UIKit"
    dependencies:
      - target: PacketTunnel
        embed: true
      - package: Yams
      - framework: Frameworks/Corebridge.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
      - sdk: UIKit.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      - sdk: Foundation.framework
      - sdk: libresolv.tbd
      - sdk: libz.tbd

  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: TunnelSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudeguard.iosvpn.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TunnelResources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelResources/PacketTunnel.entitlements
        ENABLE_BITCODE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
          - "-framework"
          - "Security"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "CFNetwork"
          - "-framework"
          - "UIKit"
    dependencies:
      - framework: Frameworks/Corebridge.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
      - sdk: UIKit.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      - sdk: Foundation.framework
      - sdk: libresolv.tbd
      - sdk: libz.tbd
